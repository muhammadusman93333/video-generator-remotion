name: Render Remotion Video

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image to display in the video'
        required: true
      script:
        description: 'Text script for subtitles and TTS'
        required: true
      composition:
        description: 'Remotion composition to render (PosVideo or MainVideo)'
        default: 'PosVideo'
        required: false
      background_music_url:
        description: 'Optional URL for background audio'
        required: false
      webhook_url:
        description: 'Optional webhook callback URL to send the generated video link'
        required: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies for Puppeteer and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2 \
            ffmpeg

      - name: Install project dependencies
        run: npm ci

      - name: Ensure Remotion browser is installed
        run: npx remotion browser ensure

      - name: Run Remotion Video Renderer
        env:
          IMAGE_URL: ${{ github.event.client_payload.image_url || inputs.image_url || 'https://uvisionpk.com/upload_media_api/uploads/generated_post_image.jpeg' }}
          SCRIPT: ${{ github.event.client_payload.script || inputs.script || 'This is a test render triggered automatically by Git push!' }}
          COMPOSITION: ${{ github.event.client_payload.composition || inputs.composition || 'random' }}
          BACKGROUND_MUSIC_URL: ${{ github.event.client_payload.background_music_url || inputs.background_music_url }}
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url || inputs.webhook_url }}
          HOOK_TEXT: ${{ github.event.client_payload.hook_text || github.event.client_payload.hookText || github.event.client_payload.hook }}
          BODY_TEXT: ${{ github.event.client_payload.body_text || github.event.client_payload.bodyText || github.event.client_payload.body }}
          THEME_COLOR: ${{ github.event.client_payload.theme_color || github.event.client_payload.themeColor || github.event.client_payload.color }}
          INDUSTRY: ${{ github.event.client_payload.industry }}
          LAYOUT_STYLE: ${{ toJson(github.event.client_payload.layoutStyle || github.event.client_payload.layout_style) }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'eastus' }}
          AZURE_VOICE: ${{ secrets.AZURE_VOICE || 'en-IN-NeerjaNeural' }}
        run: node scripts/render-cli.js
